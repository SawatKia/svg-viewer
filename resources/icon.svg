<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="#1e1e1e" />
  
  <!-- Eye Shape -->
  <g transform="translate(64, 64)" filter="url(#shadow)">
    <!-- stylized eye outline -->
    <path d="M-40,0 Q0,-35 40,0 Q0,35 -40,0 Z" fill="none" stroke="url(#grad1)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Pupil / Lens -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
    <circle cx="0" cy="0" r="6" fill="#4facfe" />
    
    <!-- Vector path inside -->
    <path d="M-20,15 Q0,25 20,15" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Corner accent representing vector node -->
  <rect x="94" y="24" width="10" height="10" fill="#4facfe" rx="2" />
  <line x1="104" y1="29" x2="114" y2="29" stroke="#4facfe" stroke-width="2" />
  <circle cx="114" cy="29" r="2" fill="#4facfe" />
</svg>
