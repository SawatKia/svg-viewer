name: Release VSIX

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile and verify
        run: npm run compile

      - name: Determine version and extract changelog
        id: meta
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = pkg.version;
            const tag = 'v' + version;
            const vsixFile = 'svg-viewer-' + version + '.vsix';
            
            // Append outputs to GITHUB_OUTPUT
            const githubOutput = process.env.GITHUB_OUTPUT;
            if (githubOutput) {
              fs.appendFileSync(githubOutput, 'version=' + version + '\n');
              fs.appendFileSync(githubOutput, 'tag=' + tag + '\n');
              fs.appendFileSync(githubOutput, 'vsix_file=' + vsixFile + '\n');
            }

            // Extract changelog for current version
            let notes = 'Release ' + tag;
            if (fs.existsSync('CHANGELOG.md')) {
              const content = fs.readFileSync('CHANGELOG.md', 'utf8');
              const escapedVersion = version.replace(/\./g, '\\.');
              const regex = new RegExp('##\\\\s*\\\\[?' + escapedVersion + '\\\\]?[^\\\\r\\\\n]*\\\\r?\\\\n([\\\\s\\\\S]*?)(?=(?:\\\\r?\\\\n##\\\\s*\\\\[?|\\\\r?\\\\n#|$))');
              const match = content.match(regex);
              if (match && match[1].trim()) {
                notes = match[1].trim();
              }
            }
            fs.writeFileSync('RELEASE_NOTES.md', notes);
          "

      - name: Package VSIX
        run: |
          npx @vscode/vsce package --no-dependencies --out "${{ steps.meta.outputs.vsix_file }}"

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.vsix_file }}
          path: ${{ steps.meta.outputs.vsix_file }}
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.meta.outputs.vsix_file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
